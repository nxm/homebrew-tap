name: Bump casks

# Pulls new upstream releases into the casks. The upstream repos are public, so
# reading their releases needs no token, and this repo's own GITHUB_TOKEN can
# push the change, with no cross-repo secret anywhere.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Update aqara-doorbell to the latest release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CASK=Casks/aqara-doorbell.rb
          TAG="$(gh release view -R nxm/aqara-doorbell --json tagName -q .tagName)"
          V="${TAG#v}"
          if grep -q "^  version \"$V\"$" "$CASK"; then
            echo "already at $V"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release download "$TAG" -R nxm/aqara-doorbell -p SHA256SUMS -D "$RUNNER_TEMP"
          SHA="$(awk -v f="./AqaraDoorbell-$V.zip" '$2 == f { print $1 }' "$RUNNER_TEMP/SHA256SUMS")"
          [ -n "$SHA" ] || { echo "no checksum for $V"; exit 1; }
          sed -i -e "s/^  version \".*\"/  version \"$V\"/" \
                 -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "aqara-doorbell $V"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so run the
  # cask test here directly.
  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: main
